services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: siagaapi
      POSTGRES_PASSWORD: siagaapi
      POSTGRES_DB: siagaapi
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siagaapi -d siagaapi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: siagaapi-backend
    environment:
      DATABASE_URL: postgresql://siagaapi:siagaapi@db:5432/siagaapi
      # Optional language model for the chat; empty means the chat runs on rules alone.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-20}
      LLM_CALLS_PER_DAY: ${LLM_CALLS_PER_DAY:-500}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  ingestor:
    image: siagaapi-backend
    command: python -m app.cli ingest --loop
    environment:
      DATABASE_URL: postgresql://siagaapi:siagaapi@db:5432/siagaapi
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

  # A small local language model for the chat. Off unless asked for: `docker compose --profile ai up`.
  # It downloads no model by itself; see "Chat language model" in the README.
  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  ollama-models:
  web-node-modules:
