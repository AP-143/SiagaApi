name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        # The same image as docker-compose.yml, so the tests meet the same PostGIS.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: siagaapi
          POSTGRES_PASSWORD: siagaapi
          POSTGRES_DB: siagaapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siagaapi -d siagaapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The tests create and drop their own throwaway database next to this one.
      DATABASE_URL: postgresql://siagaapi:siagaapi@localhost:5432/siagaapi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend tests, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Type-checks and builds.
      - run: npm run build
